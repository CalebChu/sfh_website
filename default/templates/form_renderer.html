{% for field in form %}
    <div class="fieldWrapper">
        {{ field.errors }}
        {% if field.name == 'emphasized' %}
            {{ field.label }} {{ field }}
            <div class='subtext'>the image will be displayed wider, taller, or both, depending on the aspect ratio and resolution.</div>
        {% else %}
            {{ field }}
        {% endif %}
    </div>
{% endfor %}
