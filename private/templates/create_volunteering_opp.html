{% load static %}

<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>SFH</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% include 'base_styles.html' %}
        <link rel="stylesheet" href="{% static 'style/creation-form.css' %}">
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <div id="top">
            <h1 style="text-align: center;">Create {{ title }} Listing</h1>
        </div>

        <div id="form-container">
            <form class="flex-column-body" method="POST" autocomplete="off" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form }}
                <div id="submit-container">
                    <input type="submit" value="submit">
                    {% if title == "Volunteering" %}
                        <a class="back-arrow" href="{% url 'private:volunteering_opps' %}"><i class='bx bx-x bx-md'></i>cancel</a>
                    {% else %}
                        <a class="back-arrow" href="{% url 'private:events' %}"><i class='bx bx-x bx-md'></i> cancel</a>
                    {% endif %}
                </div>
            </form>
        </div>   
    </body>
</html>
