{% extends 'base.html' %}

{% block body %}
    <h1 style="text-align: center;">Member Form</h1>

    <div>
        <form action="{% url 'members:form' %}" method="POST" autocomplete="off" enctype="multipart/form-data">
            {% csrf_token %}
            {{ user_form }}
            {{ form }} 

            <input type="submit" value="submit">
        </form>
    </div>

    <div>
        <a href="{% url 'officers:form' %}">I'm an officer</a>
    </div>
{% endblock %}
