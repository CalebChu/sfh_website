{% extends 'base.html' %}
{% load static %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'style/profile.css' %}">
    <link rel="stylesheet" href="{% static 'style/edit-profile.css' %}">
{% endblock %}

{% block body %}
    <div id="sub-body" class="flex-column-body">
        <div id="profile-title">Officer Form</div>

        <div>
            <form action="{% url 'officers:form' %}" method="POST" autocomplete="off" enctype="multipart/form-data">
                {% csrf_token %}
                {{ code_form }}
                {{ user_form }}
                {{ officer_form }}

                <div>
                    <input type="submit" value="submit">
                </div
            </form>
        </div>

        <div>
            <a href="{% url 'members:form' %}">Back to member form</a>
        </div>
    </div>
{% endblock %}
