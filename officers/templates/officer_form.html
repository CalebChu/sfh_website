{% extends 'base.html' %}

{% block body %}
   <h1 style="text-align: center;">Officer Form</h1>

    <div>
        <form action="{% url 'officers:form' %}" method="POST" autocomplete="off" enctype="multipart/form-data">
            {% csrf_token %}
            {{ code_form }}
            {{ user_form }}
            {{ officer_form }}

            <input type="submit" value="submit">
        </form>
    </div>

    <div>
        <a href="{% url 'members:form' %}">Back to member form</a>
    </div>
{% endblock %}
